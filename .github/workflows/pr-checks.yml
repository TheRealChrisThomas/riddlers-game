# ============================================================================
# PR checks — a second workflow, deliberately different from ci.yml, to show
# the features you reach for once the basic "run my tests" job exists:
#
#   * a build matrix (same job, several Node versions)
#   * job outputs + `needs` (one job consuming another's result)
#   * $GITHUB_STEP_SUMMARY (markdown report on the run's summary page)
#   * `if:` conditionals and path filters
#   * a job that reports even when an earlier one failed (`if: always()`)
# ============================================================================
name: PR checks

on:
  pull_request:
    # Default is [opened, synchronize, reopened]. `ready_for_review` means a
    # PR leaving draft gets checked without needing a new push.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1. What changed? Later jobs use this to skip work that can't be affected.
  # --------------------------------------------------------------------------
  changes:
    name: detect what changed
    runs-on: ubuntu-latest
    outputs:
      # `outputs` are how one job hands values to another. The value comes from
      # a step's own output, addressed as steps.<step-id>.outputs.<name>.
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff against the base branch

      - name: Compare against the base branch
        id: filter
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"; echo "$CHANGED"

          # `>> $GITHUB_OUTPUT` is how a step publishes a value.
          if echo "$CHANGED" | grep -q '^src/'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^web/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------
  # 2. The same tests on several Node versions, in parallel.
  # --------------------------------------------------------------------------
  test-matrix:
    name: tests (node ${{ matrix.node }})
    needs: changes
    # Skip entirely for web-only PRs — the workflow tests can't be affected.
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Don't cancel Node 20 just because Node 22 failed; you want both answers.
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Cache the Temporal test server
        uses: actions/cache@v4
        with:
          path: /tmp/temporal-test-server-sdk-typescript-*
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run tests
        run: npm test

  # --------------------------------------------------------------------------
  # 3. Web build, only when web/ actually changed.
  # --------------------------------------------------------------------------
  web-build:
    name: web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: |
          npm ci
          npm --prefix web ci
      - run: npm run build:web

      # Bundle size is worth watching on a demo people load over a phone
      # connection. Written to the run summary rather than a comment, so it
      # needs no write permissions.
      - name: Report bundle size
        run: |
          {
            echo "### Web bundle"
            echo ""
            echo '| file | size |'
            echo '| --- | ---: |'
            for f in web/dist/assets/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # 4. One place to read the outcome. `always()` so it still runs — and still
  #    reports — when something above failed or was skipped.
  # --------------------------------------------------------------------------
  summary:
    name: summary
    needs: [changes, test-matrix, web-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write the report
        run: |
          {
            echo "## PR checks"
            echo ""
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| server touched | ${{ needs.changes.outputs.server }} |"
            echo "| web touched | ${{ needs.changes.outputs.web }} |"
            echo "| workflow tests | ${{ needs.test-matrix.result }} |"
            echo "| web build | ${{ needs.web-build.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # `result` is one of success / failure / cancelled / skipped. Skipped is
      # fine here (nothing relevant changed); failure is not.
      - name: Fail if anything actually failed
        if: needs.test-matrix.result == 'failure' || needs.web-build.result == 'failure'
        run: exit 1
